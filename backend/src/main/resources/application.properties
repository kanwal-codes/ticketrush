spring.application.name=ticketrush-backend

# Java 21 virtual threads for request handling
spring.threads.virtual.enabled=true

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database connections. Measured under a 1,500-guest drop: 10 (the default) left up to 400 requests queueing for a
# connection and 20 removed the queue and cut hold p95 from about 525 ms to 285 ms. Postgres allows 100 in all.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketrush}
spring.datasource.username=${DB_USER:ticketrush}
spring.datasource.password=${DB_PASSWORD:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info,prometheus
# Metrics and health are served on their own port so they are not part of the public API.
management.server.port=${MANAGEMENT_PORT:8081}
management.metrics.tags.application=ticketrush
# Histograms let Prometheus work out latency percentiles across instances.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# No default secret on purpose: the app refuses to start without JWT_SECRET (32+ characters)
ticketrush.jwt.secret=${JWT_SECRET:}
ticketrush.jwt.ttl=PT30M
ticketrush.jwt.issuer=ticketrush

# Seat map cache lifetime (in-process). Tests set this to zero.
ticketrush.cache.seatmap-ttl=PT2S

# Demo data, only used with SPRING_PROFILES_ACTIVE=dev. No default password on purpose.
ticketrush.seed.organizer-email=${DEMO_ORGANIZER_EMAIL:organizer@ticketrush.dev}
ticketrush.seed.organizer-password=${DEMO_ORGANIZER_PASSWORD:}

# Seat holds
ticketrush.holds.ttl=PT10M
ticketrush.holds.max-seats=6
ticketrush.holds.sweep-interval=PT5S

# Waiting room. Admits admit-per-second guests per second while fewer than max-admitted are inside.
ticketrush.queue.admit-per-second=20
ticketrush.queue.max-admitted=200
ticketrush.queue.admission-ttl=PT10M
# One admission round per interval across all app instances. PT0S turns the guard off (tests).
ticketrush.queue.tick-interval=PT1S
ticketrush.queue.scheduler-delay=PT1S
ticketrush.cache.event-schedule-ttl=PT2S

# How often open waiting-room streams are sent the current status.
ticketrush.queue.push-interval=PT1S

# Payments. The mock provider stands in for a card processor. mock-slow-delay is how long tok_slow takes.
ticketrush.payments.timeout=PT10S
ticketrush.payments.mock-slow-delay=PT1.5S
# Pretend the provider takes this long to answer. Zero by default; the load tests set it to feel real.
ticketrush.payments.mock-latency=PT0S

# How long seats stay held while a guest is paying, and how long before a pending payment is looked up.
ticketrush.payments.checkout-window=PT3M
ticketrush.payments.reconcile-after=PT1M
ticketrush.payments.reconcile-interval=PT30S
ticketrush.payments.outbox-interval=PT1S
