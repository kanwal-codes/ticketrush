# Local development never asks for the sign-up bot check, even if TURNSTILE_SECRET is in the shell
# (loading .env puts it there). It is for the live site, where the matching site key is built into the web app.
ticketrush.signup.turnstile-secret=

# Development: print the body of each email, links included, since nothing is really sent.
ticketrush.mail.log-bodies=true
# Same reason as the Turnstile secret: a key in the shell must not make the dev stack ask for email confirmation.
ticketrush.mail.resend-api-key=

# Development uses the mock provider even if a Stripe key is in the shell (loading .env puts it there).
ticketrush.payments.stripe-secret-key=
