# Production settings. Add this profile (SPRING_PROFILES_ACTIVE=prod, or prod,demo for the demo deployment).

# The API description and its UI are for developers, not the public internet.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Behind a proxy that terminates TLS: trust X-Forwarded-For/Proto so client addresses and links are the real ones.
server.forward-headers-strategy=framework

# One connection string for the managed Redis (rediss://default:password@host:6379), required in production.
spring.data.redis.url=${REDIS_URL}

# Metrics and health stay on the management port, which the host must not publish.
