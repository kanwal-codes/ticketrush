# The API. Private: no public address, reached by the web app over Fly's private network as ticketrush-api.internal.
# Deploy from this folder:  fly deploy --no-public-ips
# App names are global on Fly. If "ticketrush-api" is taken, rename it here and in frontend/fly.toml (BACKEND).
app = "ticketrush-api"
# Montreal is the demo's city; Toronto is the nearest Fly region.
primary_region = "yyz"

[env]
  # prod: docs off, forwarded headers trusted, Redis from REDIS_URL. demo: the demo organizer's events (mock payments).
  SPRING_PROFILES_ACTIVE = "prod,demo"
  MANAGEMENT_PORT = "8081"

# Reachable only from other apps on the private network: there is deliberately no [[services.ports]] block.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

# Health lives on the management port, which is never published. Fly checks it from inside.
[checks.health]
  type = "http"
  port = 8081
  path = "/actuator/health"
  method = "GET"
  interval = "15s"
  timeout = "5s"
  grace_period = "90s"

[[vm]]
  # The JVM was sized and measured at 2 CPUs and 1 GB (docs/performance.md).
  size = "shared-cpu-2x"
  memory = "1gb"
