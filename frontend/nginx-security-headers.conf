# Included in every location, because an add_header in a location replaces the ones inherited from the server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Everything comes from this site. Posters and QR codes are drawn locally; the QR is shown from a blob. The one
# exception is Cloudflare's bot check at sign-up (its script and its frame). The app is a single page, so the policy of
# the first page loaded applies to all of them: the script is allowed everywhere but only the sign-up page loads it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
