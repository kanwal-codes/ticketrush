# Included in every location, because an add_header in a location replaces the ones inherited from the server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# The app uses none of these browser features, so nothing on the page (or in a frame it loads) may ask for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Everything comes from this site. Posters and QR codes are drawn locally; the QR is shown from a blob. The one
# exceptions are Cloudflare's bot check at sign-up and Stripe's card form at checkout (each one's script and frame, and
# Stripe's API). The app is a single page, so the policy of the first page loaded applies to all of them: the scripts
# are allowed everywhere but each is loaded only by the page that needs it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://js.stripe.com; frame-src https://challenges.cloudflare.com https://js.stripe.com https://hooks.stripe.com; img-src 'self' blob: data:; connect-src 'self' https://api.stripe.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
