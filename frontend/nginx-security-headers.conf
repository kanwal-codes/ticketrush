# Included in every location, because an add_header in a location replaces the ones inherited from the server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Everything comes from this site. Posters and QR codes are drawn locally; the QR is shown from a blob.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
