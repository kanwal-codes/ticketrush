<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="t d" font-family="ui-monospace, Menlo, monospace">
<title id="t">TicketRush architecture</title>
<desc id="d">A browser reaches the web app over HTTPS. The web app, nginx, serves the built site and forwards /api to the API over Fly's private network; the API has no public address at all. The API talks to Postgres and Redis inside that network, and to Stripe, Cloudflare Turnstile and Resend outside it.</desc>
<rect width="820" height="260" fill="#f6f2ea"/>

<!-- Private network boundary -->
<rect x="246" y="16" width="372" height="236" fill="none" stroke="#5b564e" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="256" y="34" font-size="10.5" fill="#5b564e">FLY PRIVATE NETWORK — NO PUBLIC ADDRESS</text>

<!-- Browser -->
<rect x="18" y="52" width="150" height="56" fill="#ffffff" stroke="#1f1d1a" stroke-width="1.5"/>
<text x="93" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1d1a">Browser</text>
<text x="93" y="92" text-anchor="middle" font-size="10" fill="#5b564e">guest or organizer</text>

<!-- web (nginx) -->
<rect x="268" y="52" width="150" height="56" fill="#ffd9c4" stroke="#1f1d1a" stroke-width="1.5"/>
<text x="343" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1d1a">ticketrush-web</text>
<text x="343" y="90" text-anchor="middle" font-size="9.5" fill="#5b564e">static site, /api proxy</text>

<!-- API -->
<rect x="450" y="52" width="150" height="56" fill="#ffd9c4" stroke="#1f1d1a" stroke-width="1.5"/>
<text x="525" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1d1a">ticketrush-api</text>
<text x="525" y="90" text-anchor="middle" font-size="9.5" fill="#5b564e">Java 21, virtual threads</text>

<!-- Postgres -->
<rect x="332" y="160" width="140" height="56" fill="#ffffff" stroke="#1f1d1a" stroke-width="1.5"/>
<text x="402" y="182" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1d1a">Postgres</text>
<text x="402" y="199" text-anchor="middle" font-size="9.5" fill="#5b564e">seats · orders · outbox</text>

<!-- Redis -->
<rect x="502" y="160" width="140" height="56" fill="#ffffff" stroke="#1f1d1a" stroke-width="1.5"/>
<text x="572" y="182" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1d1a">Redis</text>
<text x="572" y="199" text-anchor="middle" font-size="9.5" fill="#5b564e">queue · admission · limits</text>

<!-- External services -->
<rect x="660" y="46" width="140" height="46" fill="none" stroke="#1f1d1a" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="730" y="64" text-anchor="middle" font-size="11.5" fill="#1f1d1a">Stripe</text>
<text x="730" y="79" text-anchor="middle" font-size="9.5" fill="#5b564e">test mode</text>

<rect x="660" y="102" width="140" height="46" fill="none" stroke="#1f1d1a" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="730" y="118" text-anchor="middle" font-size="11" fill="#1f1d1a">Cloudflare Turnstile</text>
<text x="730" y="134" text-anchor="middle" font-size="9.5" fill="#5b564e">bot check at sign-up</text>

<rect x="660" y="158" width="140" height="46" fill="none" stroke="#1f1d1a" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="730" y="176" text-anchor="middle" font-size="11.5" fill="#1f1d1a">Resend</text>
<text x="730" y="191" text-anchor="middle" font-size="9.5" fill="#5b564e">order and account email</text>

<!-- Arrows -->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f1d1a"/>
  </marker>
</defs>
<line x1="168" y1="80" x2="266" y2="80" stroke="#1f1d1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="217" y="72" text-anchor="middle" font-size="10" fill="#5b564e">https</text>

<line x1="418" y1="80" x2="448" y2="80" stroke="#1f1d1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="433" y="72" text-anchor="middle" font-size="9" fill="#5b564e">/api</text>

<line x1="490" y1="108" x2="420" y2="158" stroke="#1f1d1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="555" y1="108" x2="572" y2="158" stroke="#1f1d1a" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="600" y1="64" x2="658" y2="64" stroke="#1f1d1a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<line x1="600" y1="80" x2="658" y2="118" stroke="#1f1d1a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<line x1="600" y1="96" x2="658" y2="176" stroke="#1f1d1a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
</svg>
