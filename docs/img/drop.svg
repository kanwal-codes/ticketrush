<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="ui-monospace, Menlo, monospace">
<title id="t">Guests are let in in the order they joined</title>
<desc id="d">For each block of 100 places in the waiting room, the median time from the sale opening until those guests were let in, in three runs of a 1,500-guest drop. Later places wait longer, close to the 2 seconds per 100 places that a rate of 50 admissions a second predicts.</desc>
<rect width="760" height="340" fill="#f6f2ea"/>
<text x="58" y="20" font-size="12" font-weight="600" fill="#1f1d1a">First come, first served: time until let in, by place in line</text>
<text x="58" y="36" font-size="11" fill="#5b564e">median seconds after the sale opened, per block of 100 places; three runs of 1,500 guests</text>
<line x1="58" y1="284.0" x2="736" y2="284.0" stroke="#d9d4cc"/><text x="50" y="288.0" text-anchor="end" font-size="11" fill="#5b564e">0s</text><line x1="58" y1="217.3" x2="736" y2="217.3" stroke="#d9d4cc"/><text x="50" y="221.3" text-anchor="end" font-size="11" fill="#5b564e">10s</text><line x1="58" y1="150.7" x2="736" y2="150.7" stroke="#d9d4cc"/><text x="50" y="154.7" text-anchor="end" font-size="11" fill="#5b564e">20s</text><line x1="58" y1="84.0" x2="736" y2="84.0" stroke="#d9d4cc"/><text x="50" y="88.0" text-anchor="end" font-size="11" fill="#5b564e">30s</text><text x="91.9" y="302" text-anchor="middle" font-size="11" fill="#5b564e">1-100</text><text x="159.7" y="302" text-anchor="middle" font-size="11" fill="#5b564e">101-200</text><text x="227.5" y="302" text-anchor="middle" font-size="11" fill="#5b564e">201-300</text><text x="295.3" y="302" text-anchor="middle" font-size="11" fill="#5b564e">301-400</text><text x="363.1" y="302" text-anchor="middle" font-size="11" fill="#5b564e">401-500</text><text x="430.9" y="302" text-anchor="middle" font-size="11" fill="#5b564e">501-600</text><text x="498.7" y="302" text-anchor="middle" font-size="11" fill="#5b564e">601-700</text><text x="566.5" y="302" text-anchor="middle" font-size="11" fill="#5b564e">701-800</text><text x="634.3" y="302" text-anchor="middle" font-size="11" fill="#5b564e">801-900</text><text x="702.1" y="302" text-anchor="middle" font-size="11" fill="#5b564e">901-1000</text>
